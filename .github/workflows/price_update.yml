name: Midday ETF Price Update

on:
  # 已停用雲端排程：改由本機 run_update.ps1 每日更新（含價格）。
  # 此雲端 job 在 GitHub runner 上 yfinance 常被限流回傳空值 → 寫入 NaN（非法 JSON）
  # 直接 push，會繞過本機 sanitize 防線並讓網頁整頁掛掉（2026-08-28 事故）。
  # 僅保留手動觸發作為備援；恢復排程請取消下列 schedule 註解。
  # schedule:
  #   - cron: '30 5 * * 1-5'   # 05:30 UTC = 13:30 Taiwan
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Update ETF prices
        run: python update_prices.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data_*.json
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Midday price update $(date +'%Y-%m-%d %H:%M')" && git push
