name: Daily ETF Holdings Update - 00988A (全球，含美股)

on:
  # 排程已改由本機 Windows 工作排程器（run_update.ps1 內含 00988A）執行。
  # 僅保留手動觸發作為備援；恢復雲端排程取消下列 schedule 註解即可。
  # schedule:
  #   - cron: '0,30 7-11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-00988A:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 排程延遲跨過台灣午夜時跳過執行，避免寫入錯誤日期資料（同 daily_update.yml）
      - name: Time window guard (skip delayed runs past TW midnight)
        if: github.event_name == 'schedule'
        run: |
          hm=$(TZ=Asia/Taipei date +%H%M)
          echo "Current Taiwan time: $hm"
          if [ "$hm" -lt 1400 ]; then
            echo "Outside allowed window (TW 14:00-23:59) — scheduled run was delayed past midnight. Skipping."
            echo "SKIP_RUN=true" >> $GITHUB_ENV
          fi

      - name: Checkout repository
        if: env.SKIP_RUN != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.SKIP_RUN != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: env.SKIP_RUN != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run 00988A update script (台灣時間中午12點起，每30分鐘檢查)
        if: env.SKIP_RUN != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: |
          python check_and_update_00988A.py || true

      - name: Commit and push changes
        if: env.SKIP_RUN != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data_00988A.json holdings/
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Auto-update 00988A holdings $(date +'%Y-%m-%d')" && git push
