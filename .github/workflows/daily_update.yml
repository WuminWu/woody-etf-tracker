name: Daily ETF Holdings Update

on:
  schedule:
    # 台灣時間 17:15–21:45（UTC+8），週一至週五，每 30 分鐘，共 10 次
    # UTC 09:15–13:45，Mon–Fri
    # 改成 :15/:45 避開 GitHub Actions 整點高負載延遲；範圍拉到 21:45 涵蓋實際延後
    # 的觸發時點，並對齊台灣主動式 ETF 官網持股的實際發佈時間（17:30 後）
    - cron: '15,45 9-13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-holdings:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # GitHub Actions 排程可能延遲數小時；若排程跨過台灣午夜才執行，
      # 腳本會把「今天」誤判為隔日並寫入帶錯誤日期的資料（含 NaN 股價）。
      # 因此排程觸發時僅允許在 TW 16:00–23:59 之間實際執行，超出即跳過。
      # 手動觸發 (workflow_dispatch) 不受此限制。
      - name: Time window guard (skip delayed runs past TW midnight)
        if: github.event_name == 'schedule'
        run: |
          hm=$(TZ=Asia/Taipei date +%H%M)
          echo "Current Taiwan time: $hm"
          if [ "$hm" -lt 1600 ]; then
            echo "Outside allowed window (TW 16:00-23:59) — scheduled run was delayed past midnight. Skipping."
            echo "SKIP_RUN=true" >> $GITHUB_ENV
          fi

      - name: Checkout repository
        if: env.SKIP_RUN != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.SKIP_RUN != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: env.SKIP_RUN != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run ETF update scripts (台股，不含 00988A)
        if: env.SKIP_RUN != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: |
          python check_and_update_00981A.py || true
          python check_and_update_00403A.py || true
          python check_and_update_00980A.py || true
          python check_and_update_00985A.py || true
          python check_and_update_00991A.py || true
          python check_and_update_00992A.py || true
          python check_and_update_00982A.py || true
          python check_and_update_00987A.py || true
          python check_and_update_00993A.py || true
          python check_and_update_00995A.py || true
          python check_and_update_00996A.py || true
          python check_and_update_index.py || true
          python record_common_actions.py || true
          python export_history.py || true
          python export_snapshots.py || true
          python daily_digest.py || true

      - name: Commit and push changes
        if: env.SKIP_RUN != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data_*.json holdings/
          [ -f history.json ] && git add history.json || echo "history.json not produced this run, skipping"
          [ -d snapshots ] && git add snapshots/ || echo "snapshots/ not produced this run, skipping"
          [ -f last_digest.txt ] && git add last_digest.txt || echo "no digest marker yet"
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "Auto-update ETF holdings $(date +'%Y-%m-%d')" && git push
